services:
  paperpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: paperpulse-web:latest
    container_name: wangji-paperpulse
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PAPERPULSE_PORT:-13001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - TZ=Asia/Shanghai
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
    dns:
      - 114.114.114.114
      - 223.5.5.5
